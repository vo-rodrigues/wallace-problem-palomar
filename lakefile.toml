name = "WallacePalomar"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "wallace"
git = "https://github.com/vo-rodrigues/wallace-problem-zfc-paper.git"
rev = "8bfced3125a685e868eaa3ece5ae6e5f16c8c59e"
subDir = "lean"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
